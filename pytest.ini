[pytest]
# Semantic regression tests for protocol v2. Visual rollout demos live in tests/visual/
# (named demo_*.py, so they are not collected).
testpaths = tests
pythonpath = .
# keep temporary run directories only for failing tests (they can be large)
tmp_path_retention_policy = failed
markers =
    slow: longer checks (oracle success rates, learning on a toy task)
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
